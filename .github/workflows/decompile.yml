name: Prepare LyricsFlow decompilation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Check original mod JAR
        run: |
          test -f original/LyricsFlow-beta-2.2+1.21.4.jar || {
            echo "::error::Missing original/LyricsFlow-beta-2.2+1.21.4.jar. Upload the original mod JAR to that path first."
            exit 1
          }

      - name: Download CFR decompiler
        run: |
          curl -L --fail --retry 3 \
            https://repo1.maven.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar \
            -o cfr.jar

      - name: Decompile mod
        run: |
          mkdir -p decompiled
          java -jar cfr.jar "original/LyricsFlow-beta-2.2+1.21.4.jar" --outputdir decompiled

      - name: Preserve Fabric metadata and mixin configs
        run: |
          mkdir -p metadata
          unzip -j "original/LyricsFlow-beta-2.2+1.21.4.jar" 'fabric.mod.json' '*.mixins.json' -d metadata || true

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyricsflow-decompiled-inspection
          path: |
            decompiled/
            metadata/
