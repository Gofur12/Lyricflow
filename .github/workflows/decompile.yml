name: Prepare Lyrics Zymu source inspection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decompile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Verify original JAR exists
        run: |
          test -f "original/LyricsZymu-Mobile-1.3_1.21.11.jar"
          jar tf "original/LyricsZymu-Mobile-1.3_1.21.11.jar" > jar-contents.txt
          grep -q '^fabric.mod.json$' jar-contents.txt

      - name: Read metadata and class versions
        run: |
          mkdir -p inspection/metadata
          unzip -p "original/LyricsZymu-Mobile-1.3_1.21.11.jar" fabric.mod.json > inspection/metadata/fabric.mod.json
          unzip -p "original/LyricsZymu-Mobile-1.3_1.21.11.jar" lyricszymu.mixins.json > inspection/metadata/lyricszymu.mixins.json
          cp jar-contents.txt inspection/metadata/
          javap -verbose -classpath "original/LyricsZymu-Mobile-1.3_1.21.11.jar" Dev.lyricszymu.LyricsZymuClient | grep -E 'major version|minor version' > inspection/metadata/class-version.txt

      - name: Download CFR decompiler
        run: curl --fail --location --retry 3 --output cfr.jar https://repo.maven.apache.org/maven2/org/benf/cfr/0.152/cfr-0.152.jar

      - name: Decompile original mod
        run: |
          mkdir -p inspection/decompiled
          java -jar cfr.jar "original/LyricsZymu-Mobile-1.3_1.21.11.jar" --outputdir inspection/decompiled --silent true

      - name: Upload inspection artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyricszymu-original-decompiled
          path: inspection/
          if-no-files-found: error
          retention-days: 14
